version: "3.9"

services:
  app:
    build: .
    container_name: statuspulse-app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis
    networks:
      - statuspulse-net
    mem_limit: 512m

  db:
    image: postgres:15
    container_name: statuspulse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: statuspulse
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - statuspulse-net
    mem_limit: 512m

  redis:
    image: redis:7
    container_name: statuspulse-redis
    networks:
      - statuspulse-net
    mem_limit: 256m

  caddy:
    image: caddy:2-alpine
    container_name: statuspulse-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - statuspulse-net

networks:
  statuspulse-net:

volumes:
  db_data:
  caddy_data:
  caddy_config:
