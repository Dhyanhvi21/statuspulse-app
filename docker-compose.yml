version: "3.9"

services:
  app:
    build: .
    container_name: statuspulse-app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis
    networks:
      - statuspulse-net
    mem_limit: 512m

  db:
    image: postgres:15
    container_name: statuspulse-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: statuspulse
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - statuspulse-net
    mem_limit: 512m

  redis:
    image: redis:7
    container_name: statuspulse-redis
    networks:
      - statuspulse-net
    mem_limit: 256m

networks:
  statuspulse-net:

volumes:
  db_data:
